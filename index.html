<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- 홈 첫 배너(가장 큰 요소) — JS 를 기다리지 않고 먼저 받는다. 홈으로 들어올 때만. HomePage 의 banners[0] 사진과 같아야 함 -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link')
        l.rel = 'preload'
        l.as = 'image'
        l.href = '/images/stores/photos/korean-02.webp'
        l.fetchPriority = 'high'
        document.head.appendChild(l)
      }
    </script>
    <title>캐치테이블</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
